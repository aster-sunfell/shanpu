# Development launchers run Java/Next on the host. Production uses deploy/compose.2c2g.yml.
name: shanpu
services:
  mysql:
    extends: {file: deploy/compose.2c2g.yml, service: mysql}
    container_name: shanpu-mysql
    restart: "no"
    cgroup_parent: ""
  redis:
    extends: {file: deploy/compose.2c2g.yml, service: redis}
    container_name: shanpu-redis
    restart: "no"
    cgroup_parent: ""
  kafka:
    extends: {file: deploy/compose.2c2g.yml, service: kafka}
    container_name: shanpu-kafka
    restart: "no"
    cgroup_parent: ""
  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: shanpu-nginx
    ulimits: {nofile: {soft: 65536, hard: 65536}}
    restart: "no"
    cgroup_parent: ""
    network_mode: host
    cpuset: ${SUT_CPUSET:-0,1}
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8081}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      GATEWAY_PORT: ${GATEWAY_PORT:-8089}
      NGINX_ENVSUBST_FILTER: ^(BACKEND_PORT|FRONTEND_PORT|GATEWAY_PORT)$
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./deploy/nginx.api.conf:/etc/nginx/api.conf:ro
      - ./deploy/nginx.backend-keepalive.conf:/etc/nginx/backend-keepalive.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$GATEWAY_PORT/gateway-health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  kafka-data:
