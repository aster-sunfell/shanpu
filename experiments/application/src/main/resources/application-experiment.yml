# Experiment application only: activate with prod,experiment,sut. Scheduled compensation must not hide original results.
shanpu:
  experiment:
    enabled: true
    journal: ${SHANPU_EXPERIMENT_JOURNAL:/evidence/commits.jsonl}
  kafka:
    dlq-rescue:
      cron: "-"
  order:
    timeout:
      cron: "-"
    reconcile:
      cron: "-"
  seckill:
    warmup:
      cron: "-"
    stock-reconcile:
      cron: "-"
logging:
  level:
    com.shanpu: INFO
