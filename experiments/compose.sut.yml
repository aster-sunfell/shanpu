name: shanpu-sut

# Fixed target-machine budget. The verifier checks both this sum and Docker HostConfig.
# Compose has no project-wide cap: 1440 MiB for containers + 608 MiB host reserve = 2 GiB.
x-test-machine:
  cpus: 2
  memory_mib: 2048
  host_reserve_mib: 608

x-common: &common
  restart: "no"
  cpuset: ${SUT_CPUSET:?Actions must allocate SUT CPUs}
  init: true
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "2"}

services:
  mysql:
    <<: *common
    image: mysql:8.0
    cpus: 0.5
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Actions initializes disposable credentials}
      MYSQL_DATABASE: shanpu_bench
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=32
      - --table-open-cache=128
      - --innodb-log-buffer-size=8M
      - --innodb-flush-log-at-trx-commit=2
      - --default-time-zone=+08:00
    ports: ["127.0.0.1:13306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin -h 127.0.0.1 -uroot ping --silent']
      interval: 15s
      timeout: 3s
      retries: 20

  redis:
    <<: *common
    image: redis:7-alpine
    cpus: 0.1
    mem_limit: 96m
    memswap_limit: 96m
    pids_limit: 32
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Actions initializes disposable credentials}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 48mb --maxmemory-policy noeviction --save "" --appendonly yes --appendfsync everysec']
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 15s
      timeout: 3s
      retries: 10

  kafka:
    <<: *common
    image: apache/kafka:3.7.2
    cpus: 0.6
    mem_limit: 448m
    memswap_limit: 448m
    pids_limit: 192
    environment:
      CLUSTER_ID: Bn7E0PgRQne9z2xH4YqKpw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: "16777216"
      KAFKA_LOG_CLEANER_THREADS: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "3"
      KAFKA_BACKGROUND_THREADS: "2"
      KAFKA_QUEUED_MAX_REQUESTS: "100"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_NETWORK_THREADS: "2"
      KAFKA_NUM_IO_THREADS: "2"
      KAFKA_NUM_RECOVERY_THREADS_PER_DATA_DIR: "1"
      KAFKA_HEAP_OPTS: -Xms128m -Xmx192m -Xss512k -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_BYTES: "134217728"
      KAFKA_LOG_SEGMENT_BYTES: "16777216"
    ports: ["127.0.0.1:19092:19092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    # No Kafka CLI healthcheck: each invocation would create another JVM in this budget.

  backend:
    <<: *common
    image: shanpu-experiment-sut:ci
    build:
      context: ${BENCH_RUNTIME:?}/build
      dockerfile: ${BENCH_ROOT:?}/experiments/docker/Sut.Dockerfile
    cpus: 0.8
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: shanpu_bench
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?Actions initializes disposable credentials}
      SUT_INSTANCE_ID: ${SUT_INSTANCE_ID:?Actions initializes disposable credentials}
      SHANPU_EXPERIMENT_JOURNAL: /evidence/commits.jsonl
    ports: ["127.0.0.1:18081:8080"]
    volumes: ["evidence:/evidence"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_started}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:8080/api/health | grep -q ''"status":"UP"''']
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 45s

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  evidence:
