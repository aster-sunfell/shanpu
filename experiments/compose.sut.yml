name: shanpu-sut

# Every service inherits the actual deployment configuration and hard limits.
x-test-machine:
  cpus: 2
  memory_mib: 2048
  host_reserve_mib: 416

services:
  mysql:
    extends: {file: ../deploy/compose.2c2g.yml, service: mysql}
  redis:
    extends: {file: ../deploy/compose.2c2g.yml, service: redis}
  kafka:
    extends: {file: ../deploy/compose.2c2g.yml, service: kafka}
  backend:
    extends: {file: ../deploy/compose.2c2g.yml, service: backend}
    image: shanpu-experiment-sut:ci
    build:
      context: ${BENCH_RUNTIME:?}/build
      dockerfile: ${BENCH_ROOT:?}/backend/Dockerfile
      target: experiment
    environment:
      SPRING_PROFILES_ACTIVE: prod,experiment,sut
      SUT_INSTANCE_ID: ${SUT_INSTANCE_ID:?Actions initializes disposable credentials}
      SHANPU_EXPERIMENT_JOURNAL: /evidence/commits.jsonl
    volumes: ["evidence:/evidence"]
  frontend:
    extends: {file: ../deploy/compose.2c2g.yml, service: frontend}
  nginx:
    extends: {file: ../deploy/compose.2c2g.yml, service: nginx}

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  evidence:
