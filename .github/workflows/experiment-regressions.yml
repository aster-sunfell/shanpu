name: Experiment tooling regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/experiments/**'
      - '!scripts/experiments/lib/report*'
      - '!scripts/experiments/lib/html_report*'
      - '!scripts/experiments/tests/test*report*'
      - 'experiments/**'
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'pom.xml'
      - '.github/actions/experiment-cache/**'
      - '.github/workflows/experiment-regressions.yml'
      - '.github/workflows/performance.yml'
  pull_request:
    paths:
      - 'scripts/experiments/**'
      - '!scripts/experiments/lib/report*'
      - '!scripts/experiments/lib/html_report*'
      - '!scripts/experiments/tests/test*report*'
      - 'experiments/**'
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'pom.xml'
      - '.github/actions/experiment-cache/**'
      - '.github/workflows/experiment-regressions.yml'
      - '.github/workflows/performance.yml'
permissions:
  contents: read
concurrency:
  group: experiment-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        experiment: [redis-filtering, kafka-burst]
    env:
      BENCH_ROOT: ${{ github.workspace }}
      BENCH_REPORTS: ${{ github.workspace }}/artifacts/regression
      BENCH_EXPERIMENT: ${{ matrix.experiment }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set ephemeral runtime
        run: echo "BENCH_RUNTIME=$RUNNER_TEMP/shanpu-regression/runtime" >> "$GITHUB_ENV"
      - name: Protocol and report checks
        run: |
          python3 -m unittest discover -s scripts/experiments/tests
          node scripts/experiments/tests/schedule.test.mjs
      - run: python3 scripts/experiments/lib/actions.py prepare
      - uses: ./.github/actions/experiment-cache
      - run: python3 scripts/experiments/lib/actions.py build
      - run: docker buildx stop
      - name: Full generator profile, overload and recovery regression
        timeout-minutes: 5
        run: |
          mkdir -p artifacts/generator
          RUNNER_CPUSET=$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["BENCH_RUNTIME"], "cpu-affinity.json")))["runner"])')
          docker run --rm --network none --cpuset-cpus "$RUNNER_CPUSET" --cpus 2 --memory 4g --memory-swap 4g --pids-limit 128 --ulimit nofile=65536:65536 \
            -v "$GITHUB_WORKSPACE/artifacts/generator:/check" --entrypoint python3 shanpu-experiment-runner:ci \
            /workspace/scripts/experiments/checks/k6_recovery.py --output /check --experiment "$BENCH_EXPERIMENT"
      - run: python3 scripts/experiments/lib/actions.py up
      - name: Fixture growth and business path regression
        timeout-minutes: 15
        run: python3 scripts/experiments/lib/actions.py fixture-check --experiment "$BENCH_EXPERIMENT" --minutes 12
      - name: Collect diagnostics
        if: always()
        run: python3 scripts/experiments/lib/actions.py collect
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-regression-${{ matrix.experiment }}
          path: artifacts/
          retention-days: 14
      - name: Destroy dedicated environment
        if: always()
        run: python3 scripts/experiments/lib/actions.py cleanup
