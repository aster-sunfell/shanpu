spring:
  profiles:
    active: dev
  application:
    name: shanpu-backend

server:
  port: 8080
  tomcat:
    threads:
      max: 100

shanpu:
  jwt:
    secret: ${JWT_SECRET:replace-me-with-a-32-byte-random-secret-for-dev-only}
    expire-days: 7

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

logging:
  level:
    com.shanpu: DEBUG
