spring:
  profiles:
    active: dev
    group:
      prod: [2c2g]
      dev: [2c2g]
  application:
    name: shanpu-backend
  flyway:
    enabled: true
    # Use a direct migration connection: MySQL capability probes may fail with
    # restricted users and would cause Druid to discard the pooled connection.
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        linger.ms: 0
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.shanpu.module.seckill.domain.msg
    listener:
      ack-mode: manual_immediate

server:
  port: 8080

shanpu:
  jwt:
    secret: ${JWT_SECRET:replace-me-with-a-32-byte-random-secret-for-dev-only}
    expire-days: 7
  snowflake:
    worker-id: 0
    datacenter-id: 0
  cache:
    local:
      activity:
        enabled: ${SHANPU_CACHE_LOCAL_ACTIVITY_ENABLED:true}
        max-size: ${SHANPU_CACHE_LOCAL_ACTIVITY_MAX_SIZE:256}
        expire-ms: ${SHANPU_CACHE_LOCAL_ACTIVITY_EXPIRE_MS:1000}
  kafka:
    consumer:
      enabled: true
      # Shared business policy: three consumers share this single-instance transaction budget.
      max-transactions-per-second: 400
    dlq-rescue:
      enabled: true
      cron: "0 */1 * * * *"
      max-fail-count: 5
      batch-size: 50

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

logging:
  level:
    com.shanpu: ${SHANPU_LOG_LEVEL:INFO}
