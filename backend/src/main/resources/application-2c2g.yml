# Shared by normal production/dev and the experiment application via profile groups.
# Whole-server resources live in deploy/compose.2c2g.yml.
server:
  tomcat:
    threads:
      max: 32
      min-spare: 4
    # 1200 fixed load VUs plus idle upstream connections and health requests.
    # Socket capacity is independent of the 32 processing threads / PID budget.
    max-connections: 2048
    accept-count: 512
    connection-timeout: 5s
    keep-alive-timeout: 5s
spring:
  datasource:
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 8
      max-wait: 3000
  data:
    redis:
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
  kafka:
    producer:
      buffer-memory: 8388608
    consumer:
      max-poll-records: 20
      properties:
        fetch.max.bytes: 1048576
        max.partition.fetch.bytes: 262144
